name: Upstream bump

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Upstream commit to pin (default: head of the upstream default branch)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Resolve upstream
        id: upstream
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          repo=$(sed -n 's/^UPSTREAM_REPO=//p' build.sh)
          old=$(sed -n 's/^UPSTREAM_COMMIT=//p' build.sh)
          if [ -n "$INPUT_COMMIT" ]; then
            new=$(git ls-remote "$repo" | awk -v c="$INPUT_COMMIT" '$1 ~ "^"c { print $1; exit }')
            [ -n "$new" ] || new="$INPUT_COMMIT"
          else
            new=$(git ls-remote "$repo" HEAD | cut -f1)
          fi
          if ! [[ "$new" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve upstream commit '${INPUT_COMMIT:-HEAD}'"
            exit 1
          fi
          # Next version: previous v<N> tag + 1.
          last=$(git tag --list 'v*' | sed -n 's/^v\([0-9][0-9]*\)$/\1/p' | sort -n | tail -n 1)
          [ -n "$last" ] || last=$(sed -n 's/^TAG=//p' build.sh)
          {
            echo "old=$old"
            echo "new=$new"
            echo "short=${new:0:12}"
            echo "version=$((last + 1))"
            echo "web=${repo%.git}"
          } >> "$GITHUB_OUTPUT"
          if [ "$new" = "$old" ]; then
            echo "Upstream is still at the pinned commit $old." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pins
        if: steps.upstream.outputs.skip == 'false'
        env:
          OLD: ${{ steps.upstream.outputs.old }}
          NEW: ${{ steps.upstream.outputs.new }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          sed -i -E "s/^UPSTREAM_COMMIT=$OLD\$/UPSTREAM_COMMIT=$NEW/; s/^TAG=[0-9]+\$/TAG=$VERSION/" build.sh
          sed -i -E "s/^const tag = \"[0-9]+\"\$/const tag = \"$VERSION\"/" bindings/torrserver.go
          grep -qx "UPSTREAM_COMMIT=$NEW" build.sh
          grep -qx "TAG=$VERSION" build.sh
          grep -qx "const tag = \"$VERSION\"" bindings/torrserver.go
          git diff

      - name: Check patches
        if: steps.upstream.outputs.skip == 'false'
        env:
          NEW: ${{ steps.upstream.outputs.new }}
        run: |
          ok=0
          scripts/check-patches.sh "$NEW" "$RUNNER_TEMP/patches.md" || ok=1
          cat "$RUNNER_TEMP/patches.md"
          cat "$RUNNER_TEMP/patches.md" >> "$GITHUB_STEP_SUMMARY"
          exit $ok

      - name: Toolchain
        if: steps.upstream.outputs.skip == 'false'
        uses: ./.github/actions/toolchain

      - name: Smoke tests
        if: steps.upstream.outputs.skip == 'false'
        run: |
          set -o pipefail
          ./build.sh test -v 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Commit, tag and release
        if: steps.upstream.outputs.skip == 'false'
        env:
          WEB: ${{ steps.upstream.outputs.web }}
          OLD: ${{ steps.upstream.outputs.old }}
          NEW: ${{ steps.upstream.outputs.new }}
          SHORT: ${{ steps.upstream.outputs.short }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          tag="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.sh bindings/torrserver.go
          git commit --quiet -m "chore: bump upstream to $SHORT, engine $VERSION" \
            -m "Upstream: $WEB/compare/$OLD...$NEW"
          git tag -a "$tag" -m "Engine $VERSION (upstream $SHORT)"
          git push --atomic origin HEAD "refs/tags/$tag"
          # Pushes made with GITHUB_TOKEN do not trigger other workflows, so start Release explicitly.
          gh workflow run release.yml --ref "$tag" -f version="$VERSION"
          echo "Bumped upstream to $SHORT, pushed $tag and triggered the Release workflow." | tee -a "$GITHUB_STEP_SUMMARY"
